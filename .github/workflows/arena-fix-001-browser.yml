name: ARENA-FIX-001 battle re-entry WebGL
# On-demand legacy regression. PR smoke is in ci-selective.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reentry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Three battles in one scene keep soft shadows and mirrored formation
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/arena-fix-001.log 2>&1 &
          sleep 2
          node tests/arena-fix-001-reentry-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-fix-001
          path: artifacts/arena-fix-001/
          if-no-files-found: warn
          retention-days: 14
