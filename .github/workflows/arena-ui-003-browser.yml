name: ARENA-UI-003 battle HUD (Chromium + WebKit)
on:
  pull_request:
    branches: [main]
    paths:
      - 'arena-ui-003.js'
      - 'arena-world-hud.js'
      - 'arena-vis-002.js'
      - 'game.js'
      - 'index.html'
      - 'styles.css'
      - 'assets/abilities/**'
      - 'tests/arena-ui-003-browser.cjs'
      - '.github/workflows/arena-ui-003-browser.yml'
permissions:
  contents: read
jobs:
  battle-hud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Queue, hero, round abilities, cooldown, long press at 844x390 and 932x430
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/arena-ui-003.log 2>&1 &
          sleep 2
          node tests/arena-ui-003-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-ui-003
          path: artifacts/arena-ui-003/
          if-no-files-found: warn
          retention-days: 14
