name: Combat 2.0 native HUD · mobile browser
on:
  pull_request:
    branches: [main]
    paths: ['combat-2-hud/**', 'tests/aud003-b17-2-hud-browser.cjs', '.github/workflows/aud003-b17-2-hud.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: combat2-native-hud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Native mobile HUD interaction and render evidence
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/combat2-hud-http.log 2>&1 &
          sleep 2
          node tests/aud003-b17-2-hud-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat2-native-hud-evidence
          path: artifacts/combat2-native-hud/
          if-no-files-found: ignore
