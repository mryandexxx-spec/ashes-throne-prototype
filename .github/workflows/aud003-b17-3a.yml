name: Combat 2.0 actual first session · mobile browser
on:
  pull_request:
    branches: [main]
    paths: ['game.js', 'tests/first-play-closeout-browser.cjs', '.github/workflows/aud003-b17-3a.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: combat2-first-session-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Real First Play, I, II, Nada receipt; manual, auto, reload and storage isolation
        env:
          COMBAT2_PILOT: '1'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/combat2-first-session-http.log 2>&1 &
          sleep 2
          node tests/first-play-closeout-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat2-first-session-evidence
          path: artifacts/squad-recovery/first-play/aud003-b17-3a/
          if-no-files-found: ignore
