name: CI / full Node regression (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full historical Node and syntax suite
        run: npm test
