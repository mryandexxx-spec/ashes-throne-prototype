name: Combat regression tests
# On-demand legacy regression. PR smoke is in ci-selective.yml.
on:
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check syntax and run regression tests
        run: npm test
