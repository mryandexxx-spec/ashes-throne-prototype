name: Combat regression tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and run regression tests
        run: npm test
