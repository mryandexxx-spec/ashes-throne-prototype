name: Command loop · mobile art and interaction
on:
  pull_request:
    branches: [main]
    paths: ['lab-command-loop/**', 'tests/command-loop-ui-browser.cjs', 'tests/command-loop-r1-browser.cjs', 'tests/command-loop-tree-browser.cjs', 'tests/command-loop-tree-r1-browser.cjs', 'tests/command-loop-tree-r2a-browser.cjs', 'tests/command-loop-r2a-art-browser.cjs', '.github/workflows/command-loop-ui.yml']
permissions:
  contents: read
concurrency:
  group: command-loop-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Mobile browser render and touch
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/command-loop-http.log 2>&1 &
          sleep 2
          node tests/command-loop-ui-browser.cjs
          node tests/command-loop-r1-browser.cjs
          node tests/command-loop-tree-browser.cjs
          node tests/command-loop-tree-r1-browser.cjs
          node tests/command-loop-tree-r2a-browser.cjs
          node tests/command-loop-r2a-art-browser.cjs
          node tests/command-loop-r2a-live-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: command-loop-ui-evidence
          path: artifacts/command-loop-ui/
          if-no-files-found: ignore
