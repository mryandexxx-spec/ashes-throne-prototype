name: ENV010 real-time combat (Chromium and WebKit)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/env010-realtime-browser.cjs'
      - 'tests/fixtures/env010-interactive-smoke.html'
      - '.github/workflows/env010-realtime-browser.yml'
      - 'game.js'
      - 'battle-animation.js'
      - 'index.html'
  workflow_dispatch:
jobs:
  real-time-autobattle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Run ENV010 real-clock full battle and replay in Chromium and WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/env010-realtime-server.log 2>&1 &
          sleep 2
          node tests/env010-realtime-browser.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env010-real-time-browser
          path: artifacts/env010-realtime/
          if-no-files-found: ignore
