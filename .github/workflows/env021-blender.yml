name: ENV021 Blender authoring pipeline

on:
  workflow_dispatch:
    inputs:
      source_blend:
        description: "Optional repository-relative .blend source; empty runs pipeline smoke sample"
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - ".github/workflows/env021-blender.yml"
      - "tools/env021-blender-pipeline.py"
      - "tools/env021-build-geology.py"
      - "tools/env021-art-pass-002.py"
      - "art/env021/**"

permissions:
  contents: read

jobs:
  blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_BLEND: ${{ inputs.source_blend || '' }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1 libgl1-mesa-dri libopengl0 xvfb python3-numpy
          blender --version

      - name: Resolve source path safely
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_BLEND" ]]; then
            echo "mode=CC0_FUSED_CLAY_WIP (not approved art)" >> "$GITHUB_STEP_SUMMARY"
          else
            case "$SOURCE_BLEND" in
              art/env021/*.blend) ;;
              *) echo "Only art/env021/*.blend is allowed"; exit 2 ;;
            esac
            if [[ ! -f "$SOURCE_BLEND" ]]; then echo "Missing source: $SOURCE_BLEND"; exit 2; fi
            echo "mode=SOURCE_BLEND" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reuse verified CC0 photogrammetry from pinned experimental commit
        if: env.SOURCE_BLEND == ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/env021
          git fetch --no-tags --depth=1 origin ec9775db9e89348546c567b18bc625ea6f0b78de
          git show FETCH_HEAD:assets/env021/PolyCliff01.glb > build/env021/cc0-coastal-cliff-input.glb
          test "$(stat -c %s build/env021/cc0-coastal-cliff-input.glb)" -gt 100000
          sha256sum build/env021/cc0-coastal-cliff-input.glb | tee build/env021/source-sha256.txt

      - name: Run Blender Python authoring/export clay sculpt
        run: |
          mkdir -p build/env021
          if [[ -n "$SOURCE_BLEND" ]]; then
            xvfb-run -a -s '-screen 0 1280x720x24' blender -b --factory-startup -noaudio --python tools/env021-blender-pipeline.py -- --source "$SOURCE_BLEND" --output build/env021
          else
            xvfb-run -a -s '-screen 0 1280x720x24' blender -b --factory-startup -noaudio --python tools/env021-blender-pipeline.py -- --mode sculpt2 --scan build/env021/cc0-coastal-cliff-input.glb --output build/env021
          fi

      - name: Verify outputs
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          p = pathlib.Path("build/env021")
          glb = p / "scene.glb"
          raw = glb.read_bytes()
          assert len(raw) >= 20 and raw[:4] == b"glTF", "Not a GLB file"
          version, size = struct.unpack_from("<II", raw, 4)
          assert version == 2 and size == len(raw), "Invalid GLB v2 length"
          for filename in ("clay-default.png", "clay-far.png", "manifest.json", "source.blend"):
              assert (p / filename).stat().st_size > 100, f"Missing/empty {filename}"
          manifest = json.loads((p / "manifest.json").read_text())
          assert manifest["acceptance"] == "NOT_ART_APPROVED"
          print("OK", len(raw), manifest)
          PY

      - name: Publish pipeline outputs (no deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env021-blender-${{ github.run_id }}
          path: build/env021/
          if-no-files-found: warn
          retention-days: 14
