name: ENV021 Pass015 near cliff plus real-time Babylon sky

on:
  workflow_dispatch:
    inputs:
      source_blend:
        description: "Optional repository-relative .blend source; empty runs pipeline smoke sample"
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - ".github/workflows/env021-blender.yml"
      - "tools/env021-blender-pipeline.py"
      - "tools/env021-build-geology.py"
      - "tools/env021-art-pass-002.py"
      - "tools/env021-art-pass-003.py"
      - "tools/env021-art-pass-004.py"
      - "tools/env021-art-pass-005.py"
      - "tools/env021-art-pass-006.py"
      - "tools/env021-art-pass-007.py"
      - "tools/env021-art-pass-008.py"
      - "tools/env021-art-pass-009.py"
      - "tools/env021-art-pass-010.py"
      - "tools/env021-art-pass-011.py"
      - "tools/env021-art-pass-012.py"
      - "tools/env021-art-pass-013.py"
      - "tools/env021-art-pass-015.py"
      - "tests/env021-sculpt15-structure.py"
      - "tests/fixtures/env021-atmosphere-015.js"
      - ".github/workflows/env021-pass015.yml"
      - "art/env021/**"

permissions:
  contents: read

jobs:
  blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_BLEND: ${{ inputs.source_blend || '' }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1 libgl1-mesa-dri libopengl0 xvfb python3-numpy
          blender --version

      - name: Resolve source path safely
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_BLEND" ]]; then
            echo "mode=CC0_FUSED_CLAY_WIP (not approved art)" >> "$GITHUB_STEP_SUMMARY"
          else
            case "$SOURCE_BLEND" in
              art/env021/*.blend) ;;
              *) echo "Only art/env021/*.blend is allowed"; exit 2 ;;
            esac
            if [[ ! -f "$SOURCE_BLEND" ]]; then echo "Missing source: $SOURCE_BLEND"; exit 2; fi
            echo "mode=SOURCE_BLEND" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retrieve licensed CC0 Poly Haven rock face texture for experimental GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/env021
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request, urllib.parse
          root=pathlib.Path("build/env021")
          api="https://api.polyhaven.com/files/rock_face"
          try:
              req=urllib.request.Request(api,headers={"User-Agent":"AshesThrone ENV021 isolated CI art-prototype"})
              with urllib.request.urlopen(req,timeout=25) as response:
                  catalog=json.load(response)
              candidates=catalog.get("Diffuse",{})
              choice=candidates.get("1k",{}).get("jpg")
              if not isinstance(choice,dict) or not choice.get("url"):
                  raise ValueError("Poly Haven Diffuse/1k/jpg unavailable")
              url=choice["url"]
              assert urllib.parse.urlsplit(url).scheme=="https"
              assert urllib.parse.urlsplit(url).hostname in ("dl.polyhaven.org","cdn.polyhaven.com"),url
              with urllib.request.urlopen(url,timeout=35) as response:
                  data=response.read(3_500_001)
              assert 100_000<len(data)<3_500_000 and data[:3]==b"\xff\xd8\xff","Not a valid 1K JPEG"
              expected_md5=choice.get("md5")
              if expected_md5:
                  assert hashlib.md5(data).hexdigest().lower()==expected_md5.lower(),"Poly Haven source MD5 mismatch"
              target=root/"polyhaven-rock-face-1k-cc0.jpg"
              target.write_bytes(data)
              digest=hashlib.sha256(data).hexdigest()
              os.environ["SHA256_ROCK"]=digest
              with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
                  f.write("ENV021_PH_ROCKFACE="+str(target.resolve())+"\n")
              print("POLYHAVEN_CC0_ROCKFACE_SOURCE",url,"SHA256",digest,"BYTES",len(data))
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
                  f.write("\n- 1K CC0 rock photo: Poly Haven rock_face; SHA256 "+digest+"\n")
          except Exception as exc:
              # Do not turn third-party API outage into a gameplay CI failure;
              # the Blender script will label and use the offline fallback.
              print("PHOTO_TEXTURE_UNAVAILABLE_OFFLINE_FALLBACK:",type(exc).__name__,str(exc)[:250])
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
                  f.write("\n- Photo texture unavailable; **procedural fallback, not photo proof**.\n")
          PY

      - name: Run Blender Python authoring/export clay sculpt
        run: |
          mkdir -p build/env021
          if [[ -n "$SOURCE_BLEND" ]]; then
            xvfb-run -a -s '-screen 0 1280x720x24' blender -b --factory-startup -noaudio --python tools/env021-blender-pipeline.py -- --source "$SOURCE_BLEND" --output build/env021
          else
            xvfb-run -a -s '-screen 0 1280x720x24' blender -b --factory-startup -noaudio --python tools/env021-blender-pipeline.py -- --mode sculpt15 --output build/env021
          fi

      - name: Preserve Blender crash trace if the runner fails
        if: failure()
        shell: bash
        run: |
          mkdir -p build/env021
          if [[ -s /tmp/blender.crash.txt ]]; then
            cp /tmp/blender.crash.txt build/env021/blender-crash.txt
            tail -100 /tmp/blender.crash.txt
          fi

      - name: Verify outputs
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          p = pathlib.Path("build/env021")
          glb = p / "scene.glb"
          raw = glb.read_bytes()
          assert len(raw) >= 20 and raw[:4] == b"glTF", "Not a GLB file"
          version, size = struct.unpack_from("<II", raw, 4)
          assert version == 2 and size == len(raw), "Invalid GLB v2 length"
          for filename in ("clay-default.png", "clay-far.png", "manifest.json", "source.blend"):
              assert (p / filename).stat().st_size > 100, f"Missing/empty {filename}"
          manifest = json.loads((p / "manifest.json").read_text())
          assert manifest["acceptance"] == "NOT_ART_APPROVED"
          assert manifest["mode"] == "ART_PASS_015_UNREVIEWED"
          json_len, json_type = struct.unpack_from("<I4s",raw,12)
          assert json_type == b"JSON"
          document = json.loads(raw[20:20+json_len].decode("utf-8"))
          assert len(document["meshes"]) == 2, "Near or far geometry missing from GLB"
          near_prim = document["meshes"][0]["primitives"][0]
          assert "TEXCOORD_0" in near_prim["attributes"], "Missing near-rock UV0"
          near_mat = document["materials"][near_prim["material"]]
          assert "baseColorTexture" in near_mat["pbrMetallicRoughness"], "Missing embedded rock texture"
          assert len(document.get("textures", [])) >= 1, "No GLB textures"
          print("OK", len(raw), manifest)
          PY

      - name: Preview actual exported GLB behind real Babylon fighters and full HUD
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/env021-preview-http.log 2>&1 &
          sleep 2
          for radius in 12 19; do
            url="http://127.0.0.1:8765/tests/fixtures/env021-glb-full-game.html?radius=$radius&pass=015"
            flags=(--headless --no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox
              --enable-webgl --enable-unsafe-swiftshader --use-angle=swiftshader
              --hide-scrollbars --force-device-scale-factor=1 --window-size=844,390
              --virtual-time-budget=22000)
            timeout 80s "$chrome" "${flags[@]}" --screenshot="$PWD/build/env021/webgl-$radius.png" "$url"               2>"/tmp/env021-preview-$radius.log"
            timeout 80s "$chrome" "${flags[@]}" --dump-dom "$url"               >"build/env021/webgl-$radius.dom.html" 2>>"/tmp/env021-preview-$radius.log"
            grep -o 'data-visual-status="[^"]*"' "build/env021/webgl-$radius.dom.html" || true
            grep -o 'data-error="[^"]*"' "build/env021/webgl-$radius.dom.html" || true
            grep -o 'data-candidate-only-[^ ]*' "build/env021/webgl-$radius.dom.html" || true
            grep -q 'data-visual-status="ready"' "build/env021/webgl-$radius.dom.html"
            grep -q 'data-art="ENV021_PASS015_GLB_NOT_APPROVED"' "build/env021/webgl-$radius.dom.html"
            grep -q 'data-webgl="true"' "build/env021/webgl-$radius.dom.html"
            test -s "build/env021/webgl-$radius.png"
          done

      - name: Render neutral lit art-review frames with real game HUD
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/env021-review-http.log 2>&1 &
          sleep 2
          for radius in 12 19; do
            url="http://127.0.0.1:8766/tests/fixtures/env021-glb-full-game.html?radius=$radius&pass=015&review=1"
            flags=(--headless --no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox
              --enable-webgl --enable-unsafe-swiftshader --use-angle=swiftshader
              --hide-scrollbars --force-device-scale-factor=1 --window-size=844,390
              --virtual-time-budget=22000)
            timeout 80s "$chrome" "${flags[@]}" --screenshot="$PWD/build/env021/art-review-$radius.png" "$url" \
              2>"/tmp/env021-review-$radius.log"
            timeout 80s "$chrome" "${flags[@]}" --dump-dom "$url" \
              >"build/env021/art-review-$radius.dom.html" 2>>"/tmp/env021-review-$radius.log"
            grep -q 'data-visual-status="ready"' "build/env021/art-review-$radius.dom.html"
            grep -q 'data-art-review="neutral_lit"' "build/env021/art-review-$radius.dom.html"
            grep -q 'data-sky="BABYLON_DYNAMIC_3D_PROCEDURAL"' "build/env021/art-review-$radius.dom.html"
            grep -q 'data-rock-material="GLB_PBR_TEXTURED_UV0"' "build/env021/art-review-$radius.dom.html"
            test -s "build/env021/art-review-$radius.png"
          done

      - name: Publish pipeline outputs (no deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env021-blender-${{ github.run_id }}
          path: build/env021/
          if-no-files-found: warn
          retention-days: 14
