name: ENV022 real-game concept backdrop WebGL

# On-demand legacy regression. PR smoke is in ci-selective.yml.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  full-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Capture real Babylon + full HUD over the concept image
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          mkdir -p artifacts
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/env022-http.log 2>&1 &
          sleep 2
          for radius in default far; do
            url="http://127.0.0.1:8765/tests/fixtures/env022-full-game.html?radius=$radius"
            "$chrome" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox \
              --enable-webgl --enable-unsafe-swiftshader --use-angle=swiftshader \
              --hide-scrollbars --force-device-scale-factor=1 --window-size=844,390 \
              --virtual-time-budget=20000 --screenshot="$PWD/artifacts/env022-$radius.png" \
              "$url" 2>"/tmp/env022-chrome-$radius.log"
            # The DOM capture starts a fresh Chromium process independent of
            # the screenshot. Heavy first-time WebGL shader compilation can make
            # that process miss the 20s virtual clock budget even though the
            # actual battle renders successfully. Retry only the capture; never
            # accept a frame without all three original visual assertions.
            dom="artifacts/env022-$radius.dom.html"
            ready=false
            for attempt in 1 2 3; do
              "$chrome" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox \
                --enable-webgl --enable-unsafe-swiftshader --use-angle=swiftshader \
                --virtual-time-budget=30000 --dump-dom "$url" \
                >"$dom" 2>>"/tmp/env022-chrome-$radius.log"
              if grep -q 'data-visual-status="ready"' "$dom" &&
                 grep -q 'data-canvas-alpha="0"' "$dom" &&
                 grep -q 'data-backdrop="env005-terrace-webp"' "$dom"; then
                ready=true
                break
              fi
              echo "::warning::ENV022 $radius DOM attempt $attempt not ready; retrying independent browser launch"
              grep -o 'data-visual-error="[^"]*"' "$dom" | head -1 || true
            done
            if [ "$ready" != true ]; then
              echo "::error::ENV022 $radius failed all three verified DOM captures"
              exit 1
            fi
            test -s "artifacts/env022-$radius.png"
            file "artifacts/env022-$radius.png"
          done

      - name: Upload actual browser evidence, no deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env022-real-game-webgl
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
