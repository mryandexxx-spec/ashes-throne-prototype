name: ENV022 optimize authentic terrain CC0 assets
on:
  pull_request:
    paths: ['tools/env022-prepare-cc0-terrain.py','.github/workflows/env022-optimize.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check numpy Pillow scipy trimesh fast-simplification
      - name: Convert finished 3D terrain models into mobile-budget vertex-colour GLB
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/env022-prepare-cc0-terrain.py assets/env022/source/mesa.glb assets/env022/MesaTerrain.glb 10500
          python3 tools/env022-prepare-cc0-terrain.py assets/env022/source/cliff-face.glb assets/env022/CliffFace.glb 5500
          python3 tools/env022-prepare-cc0-terrain.py assets/env022/source/canyon-wall.glb assets/env022/CanyonWall.glb 7000
      - name: Commit only mobile-ready GLBs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/env022/MesaTerrain.glb assets/env022/CliffFace.glb assets/env022/CanyonWall.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ENV022: vendor optimized authentic CC0 mesa and cliff modules'
          git fetch origin feat/combat-env-022-cc0-integrated-terrain
          git rebase origin/feat/combat-env-022-cc0-integrated-terrain
          git push origin HEAD:feat/combat-env-022-cc0-integrated-terrain
