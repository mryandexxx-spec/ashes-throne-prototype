name: ENV023 optimize authentic continuous gorge
on:
  pull_request:
    paths: ['tools/env023-optimize-complete-gorge.py','.github/workflows/env023-optimize.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Convert source GLB KHR_mesh_quantization to metric float geometry
        run: |
          mkdir -p /tmp/env023
          npm exec --yes --package=@gltf-transform/cli -- gltf-transform dequantize \
            assets/env023/ContinuousGorgeSource.glb /tmp/env023/gorge-float.glb
      - name: Optimize real source geometry, preserve source-derived colours
        run: |
          python3 -m pip install --disable-pip-version-check numpy scipy Pillow trimesh fast-simplification
          python3 tools/env023-optimize-complete-gorge.py /tmp/env023/gorge-float.glb assets/env023/ContinuousGorgeMobile.glb
      - name: Save mobile model only in experiment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/env023/ContinuousGorgeMobile.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ENV023: optimize genuine closed two-bank gorge into mobile GLB'
          git fetch origin feat/combat-env-023-complete-cc0-gorge
          git rebase origin/feat/combat-env-023-complete-cc0-gorge
          git push origin HEAD:feat/combat-env-023-complete-cc0-gorge
