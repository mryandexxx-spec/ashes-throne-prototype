name: ENV025 verified real Chromium PNG and six fighter surface contacts
on:
  push:
    branches: [research/env025-irregular-cc0-ledge-screening]
    paths: ['.github/workflows/env025-publish-verified-png.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Save actual Babylon screenshots only if all six fighters stand on scanned rock
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          mkdir -p docs/art/env025
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/env025-screen-server.log 2>&1 &
          sleep 2
          flags=(--headless --no-sandbox --disable-dev-shm-usage --disable-gpu-sandbox --enable-webgl --enable-unsafe-swiftshader --use-angle=swiftshader --hide-scrollbars --force-device-scale-factor=1 --window-size=844,390)
          for view in normal far; do
            radius=12
            if [ "$view" = far ]; then radius=19; fi
            url="http://127.0.0.1:8765/tests/fixtures/env017-full-game.html?radius=$radius"
            timeout 65s "$chrome" "${flags[@]}" --virtual-time-budget=30000 --screenshot="$PWD/docs/art/env025/$view.png" "$url" 2>"/tmp/env025-$view.log"
            timeout 65s "$chrome" "${flags[@]}" --virtual-time-budget=30000 --dump-dom "$url" >"/tmp/env025-$view.html" 2>>"/tmp/env025-$view.log"
            grep -q 'data-visual-status="ready"' "/tmp/env025-$view.html"
            grep -q 'data-env025="natural-crown"' "/tmp/env025-$view.html"
            grep -q 'data-contact-status="pass"' "/tmp/env025-$view.html"
            VIEW="$view" python3 - <<'PY'
          import os,re,html,json,pathlib
          view=os.environ['VIEW']
          document=pathlib.Path('/tmp/env025-'+view+'.html').read_text()
          match=re.search(r'data-contact="([^"]+)"',document)
          assert match,"No terrain intersection report"
          contacts=json.loads(html.unescape(match.group(1)))
          assert len(contacts)==6 and all(p['contact'] and p['samples']>=3 for p in contacts),contacts
          assert max(abs(p['delta']) for p in contacts)<=.35
          pathlib.Path('docs/art/env025/contact-'+view+'.json').write_text(json.dumps(contacts,indent=2,ensure_ascii=False)+'\n')
          print('VERIFIED',view,'six true scanned-surface contacts, maximum meters:',round(max(abs(p['delta']) for p in contacts),3))
          PY
            test "$(stat -c %s "docs/art/env025/$view.png")" -ge 65000
          done
      - name: Commit real captured PNG plus surface-contact reports to Draft branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/art/env025/normal.png docs/art/env025/far.png docs/art/env025/contact-normal.json docs/art/env025/contact-far.json
          git diff --cached --quiet && exit 0
          git commit -m 'ENV025: publish two real Chromium full-HUD PNGs and six-fighter triangle contacts'
          git fetch origin research/env025-irregular-cc0-ledge-screening
          git rebase origin/research/env025-irregular-cc0-ledge-screening
          git push origin HEAD:research/env025-irregular-cc0-ledge-screening
