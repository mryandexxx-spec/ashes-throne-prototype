name: ENV025 screen authentic irregular CC0 ledges before coding
on:
  pull_request:
    paths: ['.github/workflows/env025-source-screen.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  geometry-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve publisher metadata and actually inspect source glTF LODs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import urllib.request, json
          url='https://api.polyhaven.com/files/coastal_cliff_04'
          data=json.load(urllib.request.urlopen(url,timeout=30))
          print('PUBLISHER',url,'TOP_LEVEL_FORMATS',list(data),flush=True)
          for fmt in ('gltf','blend','fbx','usd','usdz'):
            if fmt not in data:continue
            desc=data[fmt]
            print('FORMAT',fmt,'OPTIONS',list(desc) if isinstance(desc,dict) else type(desc).__name__,flush=True)
            if fmt=='gltf':
              print('GLTF_SOURCE_OPTIONS_JSON',json.dumps(desc)[:15000],flush=True)
          open('artifacts/polyhaven-coastal-cliff-04-api.json','w').write(json.dumps(data,indent=2))
          PY
      - name: Download actual lightweight top-surface control model
        shell: bash
        run: |
          set -euo pipefail
          curl -fLS --retry 2 --connect-timeout 15 --max-time 90 \
            https://cdn.3dassets.dev/assets/30542/v1/model.glb -o artifacts/compact-cliff-control.glb
          python3 - <<'PY'
          import struct,json,pathlib
          f=pathlib.Path('artifacts/compact-cliff-control.glb');b=f.read_bytes()
          assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b)
          n=struct.unpack_from('<I',b,12)[0];d=json.loads(b[20:20+n])
          triangles=sum(d['accessors'][p['indices']]['count']//3 for mesh in d['meshes'] for p in mesh['primitives'] if 'indices' in p)
          print('CONTROL_GLTF',f.stat().st_size,'bytes','triangles',triangles,'extensions',d.get('extensionsUsed',[]),flush=True)
          print('CONTROL_MESH_COUNT',len(d['meshes']),'NODES',len(d.get('nodes',[])),flush=True)
          assert 1000<=triangles<=3000
          PY
      - name: Save source evidence whether gate passes or fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env025-irregular-ledge-source-evidence
          path: artifacts/
          retention-days: 14
