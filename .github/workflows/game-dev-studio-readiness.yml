name: Game Development Studio CLI and ENV021 Pass012 static GLB audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/game-dev-studio-readiness.yml"
      - "docs/GAME_DEV_STUDIO_CI.md"

permissions:
  contents: read
  actions: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download pinned Game Development Studio release and verify bytes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.5.1"
          ARCHIVE="theisegoria-game-development-studio-${VERSION}.tgz"
          EXPECTED_SHA256="9f641ed65f47059936169cb5b9ecdae8ddab7df38f1f51e6124f0d720388ee43"
          URL="https://github.com/theisegoria/game-development-studio/releases/download/v${VERSION}"
          mkdir -p "$RUNNER_TEMP/game-dev-download"
          cd "$RUNNER_TEMP/game-dev-download"
          curl --fail --location --silent --show-error --retry 3 --proto '=https' --tlsv1.2 \
            "$URL/$ARCHIVE" --output "$ARCHIVE"
          curl --fail --location --silent --show-error --retry 3 --proto '=https' --tlsv1.2 \
            "$URL/SHA256SUMS.txt" --output SHA256SUMS.txt
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ARCHIVE" | sha256sum --check --status
          grep -F "$EXPECTED_SHA256" SHA256SUMS.txt >/dev/null
          echo "GAME_DEV_TARBALL=$PWD/$ARCHIVE" >> "$GITHUB_ENV"
          echo "Verified Game Development Studio CLI v$VERSION against pinned GitHub release SHA-256." >> "$GITHUB_STEP_SUMMARY"

      - name: Install CLI in temporary runner directory (no lifecycle scripts)
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --prefix "$RUNNER_TEMP/game-dev-cli" --ignore-scripts "$GAME_DEV_TARBALL"
          echo "$RUNNER_TEMP/game-dev-cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/game-dev-cli/bin/game-dev" --version

      - name: Download pinned Pass012 artifact from verified Blender run
        uses: actions/download-artifact@v4
        with:
          name: env021-blender-42833525050
          run-id: 42833525050
          github-token: \${{ github.token }}
          path: \${{ runner.temp }}/env021-pass012

      - name: Verify exact GLB digest, size and art status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"env021-pass012"
          path=root/"scene.glb"
          meta=json.loads((root/"manifest.json").read_text())
          expected="af944376ea3d2ea286de0f185377bf2adf8277f3522faf081b98711210fe21b4"
          actual=hashlib.sha256(path.read_bytes()).hexdigest()
          assert actual==expected==meta["glb_sha256"], (actual,expected)
          assert meta["mode"]=="ART_PASS_012_UNREVIEWED"
          assert meta["acceptance"]=="NOT_ART_APPROVED"
          assert path.stat().st_size==meta["glb_bytes"]==4385208
          assert path.read_bytes()[:4]==b"glTF"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as summary:
              summary.write("\n- Source: Pass012 revision2 [Blender run 42833525050](https://github.com/mryandexxx-spec/ashes-throne-prototype/actions/runs/42833525050)\n")
              summary.write("- Verified GLB SHA-256: "+actual+"\n")
              summary.write("- Art status: NOT_ART_APPROVED; no game integration.\n")
          print("Pinned source GLB verified:",actual)
          PY

      - name: Read-only Game Development Studio GLB inspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/game-dev-report
          game-dev asset inspect "$RUNNER_TEMP/env021-pass012/scene.glb" --json > build/game-dev-report/inspect.json
          python3 - <<'PY'
          import json,os,pathlib
          report=pathlib.Path("build/game-dev-report/inspect.json")
          data=json.loads(report.read_text())
          assert isinstance(data,dict), "Expected JSON object from CLI"
          assert str(data.get("status","")).lower() not in ("failed","error"), f"CLI inspection failed: {data}"
          print("Inspection report keys:", sorted(data)[:20])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as summary:
              summary.write("- Static GLB inspection: JSON report captured as a downloadable artifact.\n")
              summary.write("- No game execution, mesh edits, GPU or paid provider calls.\n")
          PY

      - name: Preserve CLI inspection report
        uses: actions/upload-artifact@v4
        with:
          name: game-dev-env021-pass012-static-audit
          path: build/game-dev-report/inspect.json
          if-no-files-found: error
          retention-days: 14

      - name: Read-only capabilities and environment doctor
        shell: bash
        run: |
          set -euo pipefail
          game-dev --version > "$RUNNER_TEMP/game-dev-version.txt"
          game-dev capabilities --json > "$RUNNER_TEMP/game-dev-capabilities.json"
          game-dev doctor --json > "$RUNNER_TEMP/game-dev-doctor.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          version = (root / "game-dev-version.txt").read_text().strip()
          assert "1.5.1" in version, f"Unexpected CLI version: {version!r}"
          for name in ("capabilities", "doctor"):
              payload = json.loads((root / f"game-dev-{name}.json").read_text())
              assert isinstance(payload, dict), name
              print(f"{name}: JSON decoded; top-level fields = {sorted(payload)[:12]}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"\n- CLI reported version: `{version}`\n")
              summary.write("- `capabilities --json`: parsed successfully\n")
              summary.write("- `doctor --json`: parsed successfully\n")
              summary.write("- Scope: environment discovery only; **no game execution, GPU capture, paid providers, credentials, or project writes**.\n")
          PY
