name: LC-008D first-act reward browser smoke (Chromium and WebKit)
on:
  pull_request:
    branches: [main]
    paths:
      - 'lore-act1-reward-core.js'
      - 'reward-policy-core.js'
      - 'lore-reward-proof-core.js'
      - 'lore-campaign-ui.js'
      - 'lore-campaign.css'
      - 'game.js'
      - 'index.html'
      - 'tests/lc-008d-act1-browser.cjs'
      - '.github/workflows/lc-008d-act1-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-act-reward:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify earned reward, reload, single writer, write failure in Chromium/WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lc008d-http.log 2>&1 &
          sleep 2
          node tests/lc-008d-act1-browser.cjs
