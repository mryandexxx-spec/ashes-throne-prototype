name: LC-008D/008F Five Shadows rewards (Chromium and WebKit)
# On-demand legacy regression. PR smoke is in ci-selective.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-acts-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify five independent act receipts and wallet protection in Chromium/WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lc008d-http.log 2>&1 &
          sleep 2
          node tests/lc-008d-act1-browser.cjs
          node tests/lc-008f-five-acts-browser.cjs
