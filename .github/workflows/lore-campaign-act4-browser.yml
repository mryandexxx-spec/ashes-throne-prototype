name: LOREACT4001 act IV live browser
# On-demand legacy regression. PR smoke is in ci-selective.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  act4-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Nine-node-saved through Act IV on Chromium and WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lore-act4.log 2>&1 &
          sleep 2
          node tests/lore-campaign-act4-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lore-act4-mobile-e2e
          path: artifacts/lore-act4/
          retention-days: 14
          if-no-files-found: warn
