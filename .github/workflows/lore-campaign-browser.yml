name: LC-002 lore campaign landscape browser
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'game.js'
      - 'lore-campaign-data.js'
      - 'lore-campaign-core.js'
      - 'lore-campaign-ui.js'
      - 'lore-campaign.css'
      - 'tests/lore-campaign-002-browser.cjs'
      - '.github/workflows/lore-campaign-browser.yml'
permissions:
  contents: read
jobs:
  lore-map-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Start local preview server and test map in Chromium/WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lore-campaign-002-http.log 2>&1 &
          sleep 2
          node tests/lore-campaign-002-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lore-campaign-002-landscape
          path: artifacts/lore-campaign-002/
          retention-days: 14
          if-no-files-found: warn
