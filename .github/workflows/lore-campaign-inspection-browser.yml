name: LC-004 interactive inspection browser
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'lore-campaign-*.js'
      - 'lore-campaign.css'
      - 'tests/lore-campaign-004-browser.cjs'
      - 'tests/lore-campaign-004-fixture.js'
      - '.github/workflows/lore-campaign-inspection-browser.yml'
permissions:
  contents: read
jobs:
  inspection-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Inspect and compare in Chromium/WebKit mobile landscape
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lore004-server.log 2>&1 &
          sleep 2
          node tests/lore-campaign-004-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lore-campaign-004-interactive-browser
          path: artifacts/lore-campaign-004/
          retention-days: 14
          if-no-files-found: warn
