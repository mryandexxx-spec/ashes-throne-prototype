name: LOREPLAY001 playable public pilot in Chromium and WebKit
on:
  pull_request:
    branches: [main]
    paths:
      - 'game.js'
      - 'index.html'
      - 'lore-campaign-*.js'
      - 'lore-campaign.css'
      - 'tests/lore-campaign-public-pilot-browser.cjs'
      - '.github/workflows/lore-campaign-public-pilot.yml'
permissions:
  contents: read
jobs:
  public-pilot-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Complete all 3 public lore scenes and 2 real Babylon battles on Chromium and WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lore-public-pilot.log 2>&1 &
          sleep 2
          node tests/lore-campaign-public-pilot-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loreplay001-full-public-pilot-qa
          path: artifacts/lore-public-pilot/
          retention-days: 14
          if-no-files-found: warn
