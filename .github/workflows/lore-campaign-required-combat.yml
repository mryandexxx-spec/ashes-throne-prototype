name: LC-005 mandatory lore combat gates
on:
  pull_request:
    branches: [main, feat/lore-campaign-inspection-lc004]
    paths:
      - 'game.js'
      - 'index.html'
      - 'package.json'
      - 'lore-campaign-*.js'
      - 'lore-campaign.css'
      - 'tests/lore-campaign-required-combat.test.js'
      - 'tests/lore-campaign-required-combat-browser.cjs'
      - '.github/workflows/lore-campaign-required-combat.yml'
permissions:
  contents: read
jobs:
  node-story:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All core and regression tests
        run: npm test
  combat-gate-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Battle-gated campaign navigation in Chromium and WebKit landscape
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lore-required.log 2>&1 &
          sleep 2
          node tests/lore-campaign-required-combat-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lc005-mandatory-combat-browser
          path: artifacts/lore-campaign-required/
          retention-days: 14
          if-no-files-found: warn
