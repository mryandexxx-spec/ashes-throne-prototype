name: LC-007 mandatory heroes in lore squad
on:
  pull_request:
    branches: [main, feat/lore-campaign-battle-briefs-lc006]
    paths:
      - 'game.js'
      - 'index.html'
      - 'styles.css'
      - 'tests/lore-campaign-required-heroes-browser.cjs'
      - 'docs/LORE_CAMPAIGN_007_REQUIRED_HEROES.md'
      - '.github/workflows/lore-campaign-required-heroes.yml'
permissions:
  contents: read
jobs:
  required-heroes-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Real Babylon squad and mandatory Ren/Nada in Chromium/WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lore-squad.log 2>&1 &
          sleep 2
          node tests/lore-campaign-required-heroes-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lc007-required-heroes-squad
          path: artifacts/lore-required-heroes/
          retention-days: 14
          if-no-files-found: warn
