name: LC-004 lore tactical combat integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'game.js'
      - 'index.html'
      - 'lore-campaign-ui.js'
      - 'lore-campaign.css'
      - 'tests/lore-campaign-training-browser.cjs'
      - '.github/workflows/lore-campaign-training-browser.yml'
permissions:
  contents: read
jobs:
  training-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Tactical training in real Babylon arena (Chromium and WebKit)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lore-training.log 2>&1 &
          sleep 2
          node tests/lore-campaign-training-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lore-campaign-training-browser
          path: artifacts/lore-training-browser/
          retention-days: 14
          if-no-files-found: warn
