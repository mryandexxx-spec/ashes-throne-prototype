name: MAP-3D-03B residential architecture intake
on:
  pull_request:
    paths:
      - 'docs/research/map-3d-03b-architecture/**'
      - '.github/workflows/map-3d-03b-architecture.yml'
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and hash four individually verified CC0 author archives
        run: python docs/research/map-3d-03b-architecture/intake.py "$RUNNER_TEMP/architecture"
      - name: Install proven Blender version
        run: |
          python -m pip install --disable-pip-version-check bpy==4.5.17
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libxkbcommon0 libxrender1 libxi6 libxxf86vm1
      - name: Open legacy blend without scripts and capture actual imported houses
        run: python docs/research/map-3d-03b-architecture/review.py "$RUNNER_TEMP/architecture"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-3d-03b-residential-architecture
          path: ${{ runner.temp }}/architecture/
          if-no-files-found: warn
          retention-days: 30
