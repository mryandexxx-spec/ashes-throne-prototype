name: MAP-3D-03B real asset intake
on:
  pull_request:
    paths:
      - 'docs/research/map-3d-03b-assets/**'
      - '.github/workflows/map-3d-03b-assets.yml'
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch curated CC0 glTF sources and verify provider hashes
        run: python docs/research/map-3d-03b-assets/intake.py "$RUNNER_TEMP/asset-kit"
      - name: Install proven Blender version
        run: |
          python -m pip install --disable-pip-version-check bpy==4.5.17
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libxkbcommon0 libxrender1 libxi6 libxxf86vm1
      - name: Import, export actual GLBs and render two angles
        run: python docs/research/map-3d-03b-assets/review.py "$RUNNER_TEMP/asset-kit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-3d-03b-real-asset-kit
          path: ${{ runner.temp }}/asset-kit/
          if-no-files-found: warn
          retention-days: 30
