name: MAP-3D-03B CUSTOM-KIT one CPU capability test
on:
  pull_request:
    paths:
      - 'docs/research/map-3d-03b-custom-kit/**'
      - '.github/workflows/map-3d-03b-custom-kit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: map-3d-03b-custom-kit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 46029298169
          name: map-3d-03b-real-asset-kit
          path: ${{ runner.temp }}/kit
      - name: Produce known-source architecture reference and comparison renders
        run: |
          python -m pip install --disable-pip-version-check bpy==4.5.17 Pillow
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libxkbcommon0 libxrender1 libxi6 libxxf86vm1 cmake ninja-build
          python docs/research/map-3d-03b-custom-kit/compare.py reference "$RUNNER_TEMP/kit" "$RUNNER_TEMP/custom-kit"
      - name: Install official MIT model in isolated CPU environment
        run: |
          python -m venv "$RUNNER_TEMP/tsr-venv"
          source "$RUNNER_TEMP/tsr-venv/bin/activate"
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          git clone --no-checkout https://github.com/VAST-AI-Research/TripoSR.git "$RUNNER_TEMP/TripoSR"
          git -C "$RUNNER_TEMP/TripoSR" checkout 107cefdc244c39106fa830359024f6a2f1c78871
          git -C "$RUNNER_TEMP/TripoSR" rev-parse HEAD > "$RUNNER_TEMP/custom-kit/model-code.txt"
          python -m pip install 'numpy<2' omegaconf==2.3.0 Pillow==10.1.0 einops==0.7.0 transformers==4.35.0 trimesh==4.0.5 'rembg[cpu]==2.0.61' huggingface-hub==0.25.2 'imageio[ffmpeg]' xatlas==0.0.9 moderngl==5.10.0
          python -m pip install 'git+https://github.com/tatsy/torchmcubes.git'
          python -m pip freeze > "$RUNNER_TEMP/custom-kit/packages.txt"
      - name: One CPU reconstruction, vertex colors only, no source mesh supplied
        run: |
          source "$RUNNER_TEMP/tsr-venv/bin/activate"
          cd "$RUNNER_TEMP/TripoSR"
          export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4
          timeout 900 python run.py "$RUNNER_TEMP/custom-kit/input.png" --device cpu --no-remove-bg --mc-resolution 192 --chunk-size 8192 --model-save-format glb --output-dir "$RUNNER_TEMP/custom-kit/reconstruction"
          test -s "$RUNNER_TEMP/custom-kit/reconstruction/0/mesh.glb"
      - name: Render actual reconstructed geometry from five directions
        run: |
          python docs/research/map-3d-03b-custom-kit/compare.py candidate "$RUNNER_TEMP/custom-kit/reconstruction/0/mesh.glb" "$RUNNER_TEMP/custom-kit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-3d-03b-custom-kit-cpu-evidence
          path: ${{ runner.temp }}/custom-kit/
          if-no-files-found: warn
          retention-days: 30
