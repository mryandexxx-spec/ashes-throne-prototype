name: CACHE001 model persistent cache browser
on:
  pull_request:
    branches: [main]
    paths:
      - 'model-cache-sw.js'
      - 'model-cache-client.js'
      - 'tests/model-cache-browser.cjs'
      - 'index.html'
      - '.github/workflows/model-cache-browser.yml'
jobs:
  persistent-cache-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install isolated browsers
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify persistent offline model reuse in Chromium/WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/model-cache-http.log 2>&1 &
          sleep 3
          node tests/model-cache-browser.cjs
