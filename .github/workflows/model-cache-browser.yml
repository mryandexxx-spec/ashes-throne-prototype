name: ASSETLOAD001 unified asset loading and device cache browser
# On-demand legacy regression. PR smoke is in ci-selective.yml.
on:
  workflow_dispatch:
jobs:
  asset-load-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install isolated browsers
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Lobby bar, offline device cache and battle gate in Chromium/WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/model-cache-http.log 2>&1 &
          sleep 3
          node tests/model-cache-browser.cjs
