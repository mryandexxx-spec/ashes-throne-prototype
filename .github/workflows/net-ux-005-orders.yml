name: NET-UX-005 network orders Node and mobile browser
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'network-pilot.css'
      - 'network-pilot-ui.js'
      - 'package.json'
      - 'tests/network-ux-005-*'
      - '.github/workflows/net-ux-005-orders.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'network-pilot.css'
      - 'network-pilot-ui.js'
      - 'package.json'
      - 'tests/network-ux-005-*'
      - '.github/workflows/net-ux-005-orders.yml'
concurrency:
  group: netux005-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax and full Node regression
        run: |
          node --check network-pilot-ui.js
          node --check tests/network-ux-005-browser.cjs
          npm test
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Network order mobile Chromium/WebKit 844x390 and 932x430
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/netux005.log 2>&1 &
          sleep 2
          node tests/network-ux-005-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netux005-mobile-browser
          path: artifacts/netux005/
          retention-days: 7
          if-no-files-found: warn
