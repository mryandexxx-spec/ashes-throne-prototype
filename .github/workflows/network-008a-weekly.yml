name: NET-008A weekly threat Node and mobile Chromium WebKit
on:
  pull_request:
    branches: [main]
    paths:
      - 'weekly-threat-*.js'
      - 'network-*.js'
      - 'game.js'
      - 'index.html'
      - 'network-pilot.css'
      - 'reward-policy-core.js'
      - 'progress-v3-core.js'
      - 'package.json'
      - 'tests/network-008a-*'
      - 'docs/NET_008A_WEEKLY_THREAT.md'
      - '.github/workflows/network-008a-weekly.yml'
  push:
    branches: [main]
    paths:
      - 'weekly-threat-*.js'
      - 'network-*.js'
      - 'game.js'
      - 'index.html'
      - 'network-pilot.css'
      - 'reward-policy-core.js'
      - 'progress-v3-core.js'
      - 'package.json'
      - 'tests/network-008a-*'
      - '.github/workflows/network-008a-weekly.yml'
concurrency:
  group: net008a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full Node and syntax regression
        run: npm test
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: WebGL mobile landscape, weekly result and payout after reload
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/net008a.log 2>&1 &
          sleep 2
          node tests/network-008a-weekly-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: net008a-weekly-browser
          path: artifacts/net008a/
          retention-days: 7
          if-no-files-found: warn
