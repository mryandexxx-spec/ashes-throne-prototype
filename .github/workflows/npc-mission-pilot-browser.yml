name: NPCMISSION002 real opt-in mission in Chromium and WebKit
on:
  pull_request:
    branches: [main]
    paths:
      - 'npc-mission-pilot.js'
      - 'npc-enemy-data.js'
      - 'ability-data.js'
      - 'game.js'
      - 'index.html'
      - 'tests/npc-mission-pilot-browser.cjs'
      - '.github/workflows/npc-mission-pilot-browser.yml'
permissions:
  contents: read
jobs:
  npc-mission-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Real campaign training mission with NPC in Chromium and WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/npc-mission.log 2>&1 &
          sleep 2
          node tests/npc-mission-pilot-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-mission-browser
          path: artifacts/npc-mission-pilot/
          retention-days: 14
          if-no-files-found: warn
