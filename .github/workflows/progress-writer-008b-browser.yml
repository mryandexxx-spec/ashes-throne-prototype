name: LC-008B wallet session concurrency (Chromium and WebKit)
# On-demand legacy regression. PR smoke is in ci-selective.yml.
on:
  workflow_dispatch:
jobs:
  multi-tab-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Test real two-tab wallet in Chromium and WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/wallet-server.log 2>&1 &
          sleep 2
          node tests/progress-writer-008b-browser.cjs
          WALLET_BROWSER=webkit node tests/progress-writer-008b-browser.cjs
