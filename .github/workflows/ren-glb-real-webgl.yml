name: Ren GLB real Chromium WebGL smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'ren-glb-runtime.js'
      - 'ren-card-3d.js'
      - 'ren-idle-kinemiq.js'
      - 'game.js'
      - 'index.html'
      - 'styles.css'
      - 'assets/ren-animated-v02.glb'
      - 'assets/ren-wanderer-v1.glb'
      - 'tests/ren-glb-browser-smoke.cjs'
      - 'tests/ren-idle-010.test.js'
      - 'tests/ren-loading-webgl-005.cjs'
      - '.github/workflows/ren-glb-real-webgl.yml'
jobs:
  webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install isolated headless browser tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          # Chromium and its libraries are preinstalled in the pinned Noble image.
      - name: Serve local checkout and verify static Wanderer in WebGL
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ren-webgl-server.log 2>&1 &
          sleep 3
          node tests/ren-glb-browser-smoke.cjs
          node tests/ren-loading-webgl-005.cjs
          REN_BROWSER=webkit node tests/ren-loading-webgl-005.cjs
