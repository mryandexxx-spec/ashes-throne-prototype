name: Ren retarget skeletal audit
# On-demand legacy regression. PR smoke is in ci-selective.yml.
on:
  workflow_dispatch:
jobs:
  rig:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node tests/ren-retarget-rig-audit.cjs
