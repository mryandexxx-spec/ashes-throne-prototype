name: Experimental Ren texture candidate
on:
  pull_request:
    paths:
      - ".github/workflows/ren-texture-candidate.yml"
      - "assets/ren-meshy-mixamo-animated.glb"
  workflow_dispatch:

jobs:
  ren-webp-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install asset conversion CLI (CI only)
        run: npm install --prefix /tmp/ren-glb-tools --no-audit --no-fund --no-save @gltf-transform/cli@^4
      - name: Recompress only base-color textures as high-quality WebP
        run: |
          mkdir -p build/model-candidates
          /tmp/ren-glb-tools/node_modules/.bin/gltf-transform webp \
            assets/ren-meshy-mixamo-animated.glb \
            build/model-candidates/ren-webp92-preview.glb \
            --slots baseColor --quality 92
      - name: Losslessly recompress every PNG texture as WebP
        run: |
          /tmp/ren-glb-tools/node_modules/.bin/gltf-transform webp \
            assets/ren-meshy-mixamo-animated.glb \
            build/model-candidates/ren-webp-lossless-preview.glb \
            --lossless true
      - name: Verify lossless candidate preserves exact original pixels
        run: node tools/verify-lossless-glb-textures.cjs
      - name: Report original and candidate sizes
        run: |
          node -e 'const fs=require("fs"); const original=fs.statSync("assets/ren-meshy-mixamo-animated.glb").size; const webp92=fs.statSync("build/model-candidates/ren-webp92-preview.glb").size; const lossless=fs.statSync("build/model-candidates/ren-webp-lossless-preview.glb").size; console.log("REN_TEXTURE_CANDIDATE="+JSON.stringify({original,webp92,lossless,savedWebp92:original-webp92,savedLossless:original-lossless,reductionWebp92Percent:Math.round((1-webp92/original)*1000)/10,reductionLosslessPercent:Math.round((1-lossless/original)*1000)/10})); if(lossless>=original)console.warn("Lossless candidate is not smaller; do not integrate.");'
      - name: Install browser smoke dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Check WebP candidate in Chromium and WebKit
        run: |
          python3 -m http.server 8765 >/tmp/ren-model-http.log 2>&1 &
          node tests/ren-texture-candidate-browser.cjs
      - name: Upload experiment for visual inspection (not a game asset)
        uses: actions/upload-artifact@v4
        with:
          name: ren-webp-experiments-preview-only
          path: build/model-candidates/*.glb
          retention-days: 7
