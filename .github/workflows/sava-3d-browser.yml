name: Sava GLB browser integration
# On-demand legacy regression. PR smoke is in ci-selective.yml.
on:
  workflow_dispatch:
jobs:
  sava-chromium-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Exercise live Sava GLB in both browser engines
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sava-server.log 2>&1 &
          sleep 2
          node tests/sava-3d-browser.cjs
          SAVA_BROWSER=webkit node tests/sava-3d-browser.cjs
          node tests/sava-arena-mobile-browser.cjs
