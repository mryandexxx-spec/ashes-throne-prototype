name: RECOVER3D actual GLB squad in mobile Chromium and WebKit
on:
  pull_request:
    branches: [main]
    paths:
      - 'squad-stage-3d.js'
      - 'game.js'
      - 'index.html'
      - 'styles.css'
      - 'tests/squad-recover-browser.cjs'
      - '.github/workflows/squad-recover-browser.yml'
  workflow_dispatch:
jobs:
  squad-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Check actual five character GLBs, lifecycle and screen isolation in landscape
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/squad-http.log 2>&1 &
          sleep 2
          node tests/squad-recover-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squad-recovery-screenshots
          path: artifacts/squad-recovery/
