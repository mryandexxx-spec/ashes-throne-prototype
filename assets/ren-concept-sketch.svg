<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="title desc">
 <title id="title">Рен Терен — поисковый визуальный набросок</title>
 <desc id="desc">Молодой жилистый проводник из Садов над пропастью: короткие тёмные волосы, выцветшая куртка, шейный платок и моток страховочной верёвки. Это рабочая иллюстрация, не канонический портрет.</desc>
