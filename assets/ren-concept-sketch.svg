  <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4d5652"/><stop offset=".55" stop-color="#313a39"/><stop offset="1" stop-color="#242f32"/></linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b39579"/><stop offset="1" stop-color="#846c59"/></linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#141d1f" stop-opacity="0"/><stop offset="1" stop-color="#101819" stop-opacity=".8"/></linearGradient>
  <pattern id="pencil" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-3 9L9 -3 M1 13L13 1" stroke="#d2c4a2" stroke-opacity=".07" stroke-width=".6"/></pattern>
