<svg xmlns="http://www.w3.org/2000/svg" width="844" height="390" viewBox="0 0 844 390" role="img" aria-label="Лорная кампания — компактный экран iPhone landscape"><title>Лорная кампания — компактный экран iPhone landscape</title><desc>Эскиз интерфейса Пепельного престола, не реализованный игровой экран.</desc><defs>
