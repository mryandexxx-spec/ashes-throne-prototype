<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Лорная кампания — карточка выбранного узла"><title>Лорная кампания — карточка выбранного узла</title><desc>Эскиз интерфейса Пепельного престола, не реализованный игровой экран.</desc><defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#201d20"/><stop offset=".6" stop-color="#0d0f17"/><stop offset="1" stop-color="#2d231d"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f3d18a"/><stop offset="1" stop-color="#a67a43"/></linearGradient>
 <linearGradient id="panel" x1="0" x2="1"><stop stop-color="#232124"/><stop offset="1" stop-color="#15181f"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#976b37" stop-opacity=".2"/><stop offset="1" stop-color="#976b37" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#bd925b" stroke-opacity=".07"/></pattern>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#000000" flood-opacity=".55"/></filter>
 </defs>
 <rect width="1280" height="720" fill="url(#bg)"/><rect width="1280" height="720" fill="url(#grid)"/>
 <g font-family="Arial, Helvetica, sans-serif">
 <rect width="1280" height="86" fill="#0b0d12" fill-opacity=".85"/>
 <text x="40" y="38" fill="#e5bd79" font-size="18" font-weight="700" >ПЕПЕЛЬНЫЙ ПРЕСТОЛ</text>
 <text x="40" y="64" fill="#c6b199" font-size="13" font-weight="400" >ЛОРНЫЕ ИСТОРИИ / ПЯТЬ ТЕНЕЙ / ПОДРОБНОСТИ УЗЛА</text>
 <rect x="33" y="105" width="520" height="558" rx="14" fill="#151820" stroke="#6a5338" />
 <circle cx="266" cy="335" r="244" fill="url(#glow)"/>
