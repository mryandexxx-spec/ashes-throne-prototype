 <text x="619" y="153" fill="#e2b873" font-size="16" font-weight="700" >ГЛАВА I  ·  УЗЕЛ FS-02</text>
 <text x="619" y="201" fill="#f7ecd9" font-size="32" font-weight="700" >Осмотр записей</text>
 <rect x="619" y="223" width="136" height="30" rx="15" fill="#705530" stroke="#d0a870" /><text x="687" y="244" fill="#fff2d5" font-size="13" font-weight="700" text-anchor="middle">ДОСТУПНО</text>
 <rect x="765" y="223" width="165" height="30" rx="15" fill="#2e292a" stroke="#544a41" /><text x="847.5" y="244" fill="#d0bb9c" font-size="13" font-weight="700" text-anchor="middle">ИССЛЕДОВАНИЕ</text>
 <path d="M619 274 L1215 274" stroke="#9f8058" opacity=".55" stroke-width="1" fill="none"/>
 <text x="619" y="316" fill="#d4b589" font-size="14" font-weight="700" >ЦЕЛЬ УЗЛА</text>
 <text x="619" y="345" fill="#efe3d3" font-size="18" font-weight="400" >Сопоставить два источника и отметить</text>
 <text x="619" y="373" fill="#efe3d3" font-size="18" font-weight="400" >заметное расхождение.</text>
 <text x="619" y="424" fill="#d4b589" font-size="14" font-weight="700" >ДОСТУП</text>
 <text x="619" y="453" fill="#d2c4b0" font-size="16" font-weight="400" >FS-01 пройден. Повторить сюжет можно позже.</text>
 <text x="619" y="503" fill="#d4b589" font-size="14" font-weight="700" >ПОСЛЕ ПРОХОЖДЕНИЯ</text>
 <text x="619" y="531" fill="#d2c4b0" font-size="16" font-weight="400" >История останется доступна для повтора.</text>
 <rect x="619" y="576" width="368" height="50" rx="8" fill="url(#gold)" stroke="#f0cb8a" /><text x="803" y="608" fill="#251e16" font-size="17" font-weight="700" text-anchor="middle">НАЧАТЬ</text>
 <rect x="999" y="576" width="211" height="50" rx="8" fill="#26242a" stroke="#7d6550" /><text x="1104.5" y="608" fill="#ead8c0" font-size="17" font-weight="700" text-anchor="middle">К КАРТЕ</text>
 <text x="40" y="702" fill="#baa58a" font-size="12" font-weight="400" >ЭСКИЗ · КАРТОЧКА УЗЛА · ФОРМУЛИРОВКИ ЗАДАЧ ЧЕРНОВЫЕ · НЕ РЕАЛИЗОВАНО</text>
