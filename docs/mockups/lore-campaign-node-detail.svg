 <path d="M 64 545 Q 196 482 267 386 T 497 212" stroke="#d4a966" stroke-width="3" stroke-dasharray="8 9" fill="none"/>
 <circle cx="95" cy="531" r="25" fill="#3a5242" stroke="#dfbc7a" stroke-width="3"/><text x="95" y="539" fill="#f7ead4" font-size="22" font-weight="700" text-anchor="middle">1</text>
 <circle cx="273" cy="385" r="34" fill="#785632" stroke="#f1ca84" stroke-width="3"/><text x="273" y="395" fill="#fff1d1" font-size="27" font-weight="700" text-anchor="middle">2</text>
 <circle cx="494" cy="216" r="25" fill="#24272c" stroke="#847a67" stroke-width="3"/><text x="494" y="224" fill="#c7c1b4" font-size="22" font-weight="700" text-anchor="middle">3</text>
 <text x="64" y="144" fill="#d8b37b" font-size="14" font-weight="700" >КАРТА / ОБЗОР</text>
 <text x="72" y="610" fill="#e8d4b4" font-size="18" font-weight="700" >Выбран FS-02</text>
