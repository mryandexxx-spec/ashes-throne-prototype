<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Лорная кампания — сценарная сцена и выбор"><title>Лорная кампания — сценарная сцена и выбор</title><desc>Эскиз интерфейса Пепельного престола, не реализованный игровой экран.</desc><defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#201d20"/><stop offset=".6" stop-color="#0d0f17"/><stop offset="1" stop-color="#2d231d"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f3d18a"/><stop offset="1" stop-color="#a67a43"/></linearGradient>
 <linearGradient id="panel" x1="0" x2="1"><stop stop-color="#232124"/><stop offset="1" stop-color="#15181f"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#976b37" stop-opacity=".2"/><stop offset="1" stop-color="#976b37" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#bd925b" stroke-opacity=".07"/></pattern>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#000000" flood-opacity=".55"/></filter>
 </defs>
 <rect width="1280" height="720" fill="url(#bg)"/><rect width="1280" height="720" fill="url(#grid)"/>
 <g font-family="Arial, Helvetica, sans-serif">
 <rect width="1280" height="92" fill="#0b0c12" fill-opacity=".85"/>
 <text x="40" y="35" fill="#edcd91" font-size="21" font-weight="700" >ХРОНИКА ПЯТИ ТЕНЕЙ</text>
 <text x="40" y="65" fill="#c2ac91" font-size="14" font-weight="700" >ГЛАВА I  /  FS-02  /  ОСМОТР</text>
 <rect x="930" y="29" width="161" height="30" rx="15" fill="#2e292a" stroke="#544a41" /><text x="1010.5" y="50" fill="#d0bb9c" font-size="13" font-weight="700" text-anchor="middle">ПРОСМОТРЕНО</text>
 <rect x="1102" y="29" width="137" height="30" rx="15" fill="#2e292a" stroke="#544a41" /><text x="1170.5" y="50" fill="#d0bb9c" font-size="13" font-weight="700" text-anchor="middle">К КАРТЕ</text>
 <rect x="30" y="118" width="473" height="530" rx="12" fill="#191b1e" stroke="#826747"/>
 <rect x="55" y="145" width="423" height="405" rx="10" fill="url(#bg)" stroke="#5a4b3d"/>
 <path d="M70 476 L130 367 L172 404 L235 264 L308 378 L382 306 L462 456 V533 H70 Z" fill="#51433c" opacity=".65"/>
 <path d="M70 507 L145 435 L208 453 L292 342 L389 460 L464 395 V536 H70 Z" fill="#2b2c30"/>
 <path d="M316 191 L344 240 L322 323 L351 359 L306 414 L286 349 L294 297 Z" fill="#91714b" opacity=".38"/>
 <rect x="85" y="174" width="351" height="50" rx="7" fill="#131419" fill-opacity=".74"/>
 <text x="261" y="193" fill="#cbb692" font-size="12" font-weight="700" text-anchor="middle">МЕСТО ДЛЯ ИЛЛЮСТРАЦИИ</text>
 <text x="261" y="211" fill="#aa9880" font-size="11" font-weight="400" text-anchor="middle">арт не утверждён</text>
 <text x="55" y="581" fill="#b7a07a" font-size="12" font-weight="700" >ЛОКАЦИЯ / СЦЕНА</text>
 <text x="55" y="612" fill="#f3e5ce" font-size="22" font-weight="700" >Сады над пропастью</text>
 <rect x="526" y="118" width="725" height="530" rx="12" fill="url(#panel)" stroke="#a78348" filter="url(#shadow)"/>
 <text x="559" y="160" fill="#d9b77c" font-size="14" font-weight="700" >СЮЖЕТНАЯ СЦЕНА  ·  КОНЦЕПТ</text>
 <path d="M559 178 L1218 178" stroke="#826b4e" opacity=".58" stroke-width="1" fill="none"/>
 <text x="559" y="222" fill="#f4e9d6" font-size="25" font-weight="700" >ПРОВЕРКА СВЕДЕНИЙ</text>
 <text x="559" y="269" fill="#f0e4d1" font-size="20" font-weight="400" >Здесь будет короткая игровая сцена,</text>
 <text x="559" y="298" fill="#f0e4d1" font-size="20" font-weight="400" >отредактированная по принятому тексту.</text>
 <text x="559" y="327" fill="#bea98d" font-size="17" font-weight="400" >Макет не содержит вымышленных реплик.</text>
 <text x="559" y="382" fill="#d4b589" font-size="14" font-weight="700" >ЧТО ПРОВЕРИТЬ СНАЧАЛА?</text>
 <rect x="559" y="400" width="659" height="54" rx="8" fill="#302b2a" stroke="#ae8756" />
 <text x="581" y="434" fill="#f0e0c7" font-size="19" font-weight="700" >A. Осмотреть журнал</text>
 <rect x="559" y="466" width="659" height="54" rx="8" fill="#302b2a" stroke="#ae8756" />
 <text x="581" y="501" fill="#f0e0c7" font-size="19" font-weight="700" >Б. Сравнить отдельный лист</text>
 <path d="M559 555 L1218 555" stroke="#826b4e" opacity=".58" stroke-width="1" fill="none"/>
 <text x="559" y="594" fill="#cbb48f" font-size="15" font-weight="700" >ПРОПУСТИТЬ ПРОСМОТРЕННОЕ</text>
 <text x="1195" y="594" fill="#dfc99d" font-size="15" font-weight="700" text-anchor="end">1 / 3</text>
 <text x="40" y="698" fill="#bba88e" font-size="12" font-weight="400" >ЭСКИЗ СЦЕНЫ · ВАРИАНТЫ ПОКАЗЫВАЮТ UX, НЕ СОГЛАСОВАННУЮ СЦЕНАРНУЮ РАЗВИЛКУ</text>
</g></svg>