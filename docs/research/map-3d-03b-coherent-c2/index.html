<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset-first static art pilot</title><style>html,body,canvas{width:100%;height:100%;margin:0;display:block;overflow:hidden}canvas{touch-action:none}#state{position:fixed;left:8px;top:8px;color:white;background:#20232b;padding:4px 8px;font:12px system-ui;z-index:2}</style><canvas id="canvas"></canvas><div id="state">Static art review</div><script src="babylon.js"></script><script src="babylonjs.loaders.min.js"></script><script>
(async()=>{
 const B=BABYLON, canvas=document.getElementById('canvas'), start=performance.now(), meta=await(await fetch('pilot.json')).json();
 const engine=new B.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:false});
 const scene=new B.Scene(engine);scene.useRightHandedSystem=true;scene.clearColor=new B.Color4(.29,.38,.46,1);
 const c=meta.camera,target=new B.Vector3(...c.target);
 const cam=new B.ArcRotateCamera('review',c.alpha,c.beta,35,target,scene);cam.mode=B.Camera.ORTHOGRAPHIC_CAMERA;scene.activeCamera=cam;
 const x=c.halfHeight*engine.getRenderWidth()/engine.getRenderHeight();cam.orthoLeft=-x;cam.orthoRight=x;cam.orthoTop=c.halfHeight;cam.orthoBottom=-c.halfHeight;
 const hemi=new B.HemisphericLight('ambient',new B.Vector3(0,1,0),scene);hemi.intensity=.55;hemi.groundColor=new B.Color3(.38,.34,.31);
 const sun=new B.DirectionalLight('sun',new B.Vector3(-.9,-.7,-.5),scene);sun.intensity=2.8;sun.diffuse=new B.Color3(1,.92,.79);sun.position=new B.Vector3(30,24,16);
 const art=await B.SceneLoader.ImportMeshAsync(null,'','pilot.glb',scene);
 if(!art.meshes.some(m=>m.getTotalVertices()>0))throw Error('Missing art meshes');
 const hero=await B.SceneLoader.ImportMeshAsync(null,'hero/','ren.glb',scene);for(const g of hero.animationGroups)g.stop();
 const root=hero.meshes[0];root.computeWorldMatrix(true);const bounds=root.getHierarchyBoundingVectors(true),height=bounds.max.y-bounds.min.y;if(!(height>0))throw Error('Invalid Ren height');
 const holder=new B.TransformNode('review hero',scene);root.parent=holder;holder.scaling.setAll(1.7/height);holder.position.set(meta.hero[0],meta.hero[1]-bounds.min.y*1.7/height,meta.hero[2]);holder.rotation.y=Math.PI/2;
 const idle=hero.animationGroups.find(g=>g.name==='Idle_4');if(!idle)throw Error('Missing Ren idle');idle.start(true);
 const shadows=new B.ShadowGenerator(2048,sun);shadows.usePercentageCloserFiltering=true;shadows.normalBias=.025;shadows.bias=.0008;sun.autoCalcShadowZBounds=true;sun.autoUpdateExtends=true;
 for(const m of [...art.meshes,...hero.meshes]){if(m.getTotalVertices()>0){shadows.addShadowCaster(m,false);m.receiveShadows=true;}}
 scene.fogMode=B.Scene.FOGMODE_LINEAR;scene.fogColor=new B.Color3(.29,.38,.46);scene.fogStart=38;scene.fogEnd=75;
 scene.imageProcessingConfiguration.toneMappingEnabled=true;scene.imageProcessingConfiguration.toneMappingType=B.ImageProcessingConfiguration.TONEMAPPING_ACES;scene.imageProcessingConfiguration.exposure=1.1;scene.imageProcessingConfiguration.contrast=1.08;await scene.whenReadyAsync();
 scene.render();scene.render();idle.pause();document.getElementById('state').remove();
 const screen=B.Vector3.Project(holder.position,B.Matrix.Identity(),scene.getTransformMatrix(),cam.viewport.toGlobal(engine.getRenderWidth(),engine.getRenderHeight()));
 window.pilot={ready:true,renderSize:[engine.getRenderWidth(),engine.getRenderHeight()],meshes:scene.meshes.length,vertices:scene.meshes.reduce((n,m)=>n+m.getTotalVertices(),0),textures:scene.textures.length,heroScreen:[screen.x,screen.y],readyMs:performance.now()-start,scope:meta.scope};
})().catch(e=>{window.pilot={ready:false,error:String(e)};console.error(e);document.getElementById('state').textContent=String(e)});
</script></html>
