<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Пепельный престол — тест 3D-локации</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151b20;color:#ede4cf;font:13px system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}canvas{width:100%;height:100%;display:block;touch-action:none}#hud,#bottom{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;align-items:center;gap:6px;pointer-events:none}#hud{top:max(6px,env(safe-area-inset-top))}#bottom{bottom:max(6px,env(safe-area-inset-bottom))}#status,#fps,#build{background:#24221de8;padding:6px 9px;border:1px solid #816c48;border-radius:5px}#status{max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button,a.control{pointer-events:auto;background:#29251f;color:inherit;border:1px solid #8e7853;border-radius:6px;padding:8px 10px;min-height:44px;font:inherit;touch-action:manipulation;white-space:nowrap}button:disabled{opacity:.5}.spacer{flex:1}a.control{text-decoration:none;display:inline-flex;align-items:center}#fps{font-variant-numeric:tabular-nums}#build{font-size:11px}#credits{position:absolute;bottom:calc(max(6px,env(safe-area-inset-bottom)) + 48px);left:max(8px,env(safe-area-inset-left));font-size:11px;color:#e3d6c1;background:#24221de8;padding:5px 8px;border-radius:4px}#credits a{color:inherit}#portrait{display:none;pointer-events:none;position:absolute;top:45%;left:10%;width:80%;text-align:center;background:#24221de8;padding:12px;border:1px solid #816c48}@media(orientation:portrait){#portrait{display:block}#hud,#bottom{flex-wrap:wrap}#status{max-width:100%}#credits{bottom:124px}}@media(max-height:350px){#hud,#bottom{gap:4px}#status{padding:5px 6px}#build{font-size:10px}button,a.control{padding:6px 8px}}

#objective{position:absolute;top:calc(max(6px,env(safe-area-inset-top)) + 48px);left:max(8px,env(safe-area-inset-left));padding:6px 10px;background:#18181de8;border-left:3px solid #d5ab6a;max-width:48%;pointer-events:none}
#poi{position:absolute;inset:0;pointer-events:none}#poi button{position:absolute;transform:translate(-50%,-50%);background:linear-gradient(#3d3224,#18181d);border-color:#d5ab6a;box-shadow:0 2px 6px #0009;padding:5px 10px;min-width:44px}
#interaction{position:absolute;right:max(8px,env(safe-area-inset-right));bottom:calc(max(6px,env(safe-area-inset-bottom)) + 50px);max-width:48%;background:#18181df5;border:1px solid #a78348;padding:8px 10px;border-radius:8px;box-shadow:0 3px 14px #0008}
#interaction-title{margin:0 0 5px;color:#f0c879;font-size:13px;font-weight:600}#interaction-actions{display:flex;flex-wrap:wrap;gap:5px}#interaction-actions button{white-space:normal} [hidden]{display:none!important}
</style></head>
<body><canvas aria-label="Тестовая трёхмерная локация"></canvas>
<div id="poi" hidden></div><div id="objective" role="status">Тестовый профиль · осмотри пост или двор</div><section id="interaction" hidden aria-label="Событие"><h2 id="interaction-title"></h2><div id="interaction-actions"></div></section><div id="hud"><span id="status" role="status">Загрузка…</span><span class="spacer"></span><button id="overview" aria-pressed="false">Обзор</button><button id="pace">Бег</button><button id="stop" disabled>Стоп</button><button id="restart">Сброс</button></div>
<div id="bottom"><span id="fps" aria-live="off">FPS —</span><span id="build">MAP-3D · COMBAT-06B</span><span class="spacer"></span><button id="shadows" aria-pressed="true" disabled>Тени: вкл</button><button id="resolution" aria-pressed="false" disabled>Чёткость: 100%</button><a class="control" href="../../">В обычную игру</a></div>
<div id="credits">Окружение: <a href="https://www.wildfiregames.com/">Wildfire Games</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a> · <a href="../map-3d/level/ATTRIBUTION.txt">Авторы и изменения</a></div>
<div id="portrait">Для тестирования поверни телефон горизонтально.</div>
<script src="../../progress-writer-core.js"></script><script src="../../map-3d-profile.js"></script><script src="../map-3d/babylon.js"></script><script src="../map-3d/babylonjs.loaders.min.js"></script><script type="module" src="lab.js"></script></body></html>
