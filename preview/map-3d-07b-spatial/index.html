<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;margin:0;background:#303e41;color:#f0e9d8;font:14px system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}canvas{width:100%;height:100%;display:block;touch-action:none;outline:0}
header{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));padding:8px 12px;border:1px solid #a68e60;background:#242a27e8;border-radius:6px;max-width:70%;pointer-events:none}

nav{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:none}

button[aria-pressed=true]{background:#514b38;border-color:#e3c88a}button:disabled{opacity:.5}
#status{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));padding:8px;border-radius:5px;background:#242a27e8;font-size:11px;max-width:29%;pointer-events:none}

</style></head>
