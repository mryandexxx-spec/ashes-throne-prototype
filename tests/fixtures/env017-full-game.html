<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ENV017 actual combat / projection diagnostic</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;overflow:hidden;border:0;background:#19242a}iframe{display:block}</style>
</head><body><iframe id="game" src="../../index.html" title="Live combat UI"></iframe>
<script>
/* Must pass only after ENV017 is loaded in the REAL index.html Babylon Scene.
 * Screenshot covers actual 844x390 HUD, not a detached art-only fixture.
 * ?radius=19 covers the far view. No synthetic image replaces the canvas.
 */
(()=>{
 const frame=document.querySelector("#game"),data=document.documentElement.dataset;
 let tick=0,entered=false,launched=false;
 const far=new URLSearchParams(location.search).get("radius")==="19";
 const poll=setInterval(()=>{
  try{
   if(++tick>120)throw Error("ENV017 diagnostic timeout");
   const doc=frame.contentDocument,win=frame.contentWindow;
   if(!doc||doc.readyState!=="complete")return;
   if(doc.querySelector("#loginCalendar.active")){
    doc.querySelector('#loginCalendar [data-screen="home"]')?.click();return;
   }
   if(doc.querySelector("#home.active")&&!entered){
    entered=true;doc.querySelector("#startBattle")?.click();return;
   }
   if(doc.querySelector("#squad.active")&&!launched){
    launched=true;doc.querySelector("#squadStart")?.click();return;
   }
   if(!doc.querySelector("#battle.active"))return;
   const canvas=doc.querySelector("#renderCanvas");
   if(!canvas||!canvas.width||!canvas.height)return;
   if(doc.documentElement.dataset.env026Assets==="loading")return;
   if(doc.documentElement.dataset.env026Assets!=="ready"||
      doc.documentElement.dataset.env026AuthoredBlender!=="ready")
    throw Error("ENV026 genuine natural cliff failed to load: "+doc.documentElement.dataset.env026Assets);
   if(doc.documentElement.dataset.environment!=="ENV017"||
      doc.documentElement.dataset.env017Massing!=="ready")
    throw Error("ENV017 marker missing (old environment or fallback)");
   const B=win.BABYLON,scene=win.eval("scene"),
    camera=win.eval("arenaCamera"),engine=win.eval("engine");
   if(!scene||!camera||!engine||!(engine.getCaps().maxTexturesImageUnits>0))
    throw Error("real Babylon WebGL not available");
   if(scene.meshes.filter(m=>m.name.startsWith("env026_external_")).length!==1||
      scene.meshes.find(m=>m.name==="env009_living_ledge")?.isEnabled()!==false||
      scene.meshes.find(m=>m.name==="env009_ravine")?.isEnabled()!==false||
      scene.meshes.some(m=>m.name.startsWith("env010_glb_")))
    throw Error("wrong geometry loaded");
   // Exact feet-to-scanned-surface diagnostic. Actor bases remain at y=.08;
   // intersect vertical lines with the ACTUAL imported GLB triangles, not a
   // fabricated floor, shadow, screen pixel, or ENV009 hidden mesh.
   const terrain=scene.meshes.find(m=>m.name.startsWith("env026_external_"));
   const verts=terrain?.getVerticesData(B.VertexBuffer.PositionKind);
   const faces=terrain?.getIndices();
   if(!verts||!faces)throw Error("ENV026 source triangle buffers unavailable");
   const actorVisuals=win.eval("meshes");
   const contact=[];
   const offsets=[[0,0],[.3,0],[-.3,0],[0,.3],[0,-.3]];
   function sample(x,z){
    let top=-Infinity;
    for(let i=0;i<faces.length;i+=3){
     const ai=faces[i]*3,bi=faces[i+1]*3,ci=faces[i+2]*3;
     const ax=verts[ai],az=verts[ai+2],bx=verts[bi],bz=verts[bi+2],cx=verts[ci],cz=verts[ci+2];
     const den=(bz-cz)*(ax-cx)+(cx-bx)*(az-cz);
     if(Math.abs(den)<1e-10)continue;
     const u=((bz-cz)*(x-cx)+(cx-bx)*(z-cz))/den;
     if(u<-.00001||u>1.00001)continue;
     const v=((cz-az)*(x-cx)+(ax-cx)*(z-cz))/den;
     if(v<-.00001||u+v>1.00001)continue;
     const y=u*verts[ai+1]+v*verts[bi+1]+(1-u-v)*verts[ci+1];
     if(y>top)top=y;
    }
    return Number.isFinite(top)?top:null;
   }
   for(const [id,actor] of Object.entries(actorVisuals)){
    if(!actor?.base?.isEnabled?.())continue;
    const pos=actor.base.position;
    const samples=offsets.map(([dx,dz])=>sample(pos.x+dx,pos.z+dz));
    const valid=samples.filter(Number.isFinite);
    const nearest=valid.length?valid.reduce((a,b)=>Math.abs(a-.02)<Math.abs(b-.02)?a:b):null;
    const delta=nearest===null?null:Number((nearest-.02).toFixed(3));
    contact.push({id,x:Number(pos.x.toFixed(2)),z:Number(pos.z.toFixed(2)),
     surfaceY:nearest===null?null:Number(nearest.toFixed(3)),delta,
     samples:valid.length,contact:delta!==null&&Math.abs(delta)<=.35&&samples[0]!==null&&valid.length>=3});
   }
   data.contact=JSON.stringify(contact);
   data.contactStatus=contact.length===6&&contact.every(x=>x.contact)?"pass":"fail";
   if(data.contactStatus!=="pass")
    throw Error("ENV026 six-fighter real-GLB surface contact FAIL: "+JSON.stringify(contact));
   if(far)camera.radius=19;
   const view=win.eval("CombatEnvironment017").inspect(B,scene,camera,
    engine.getRenderWidth(),engine.getRenderHeight());
   if(!view||Math.abs(view.radius-(far?19:12))>.01)
    throw Error("camera projection unavailable");
   const values=[view.ledgeRightEdge,view.gapSample,view.bankNear,view.bankFar,view.leftRoot];
   if(values.some(v=>v.some(n=>!Number.isFinite(n))))
    throw Error("nonfinite projection");
   data.camera=JSON.stringify(view);
   data.environment="ENV017";data.env026="authored-blender";data.webgl="true";data.view=far?"far":"normal";
   clearInterval(poll);
   setTimeout(()=>{data.visualStatus="ready";},700);
  }catch(e){clearInterval(poll);data.visualStatus="error";data.error=e.message;console.error(e)}
 },125);
})();
</script></body></html>
