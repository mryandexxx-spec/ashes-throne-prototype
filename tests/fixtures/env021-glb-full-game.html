<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ENV021 Pass005 / native Babylon GLB / real battle QA only</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#8c969b}</style>
</head><body><iframe id="game" src="../../index.html" title="Actual Babylon battle with Pass005 GLB"></iframe>
<script>
/* CI-only full-game preview. Official Babylon 9.33.2 glTF loader performs
 * node transforms and glTF handedness conversion. Custom manual conversion
 * previously placed the terrain on the wrong side of the camera.
 * No runtime import, scene asset or loader is shipped to main.
 * Assert actual GLB-only framebuffer pixels at both game-camera radii. */
(()=>{
  const frame=document.getElementById("game"),d=document.documentElement.dataset;
  const far=new URLSearchParams(location.search).get("radius")==="19";
  let attempts=0,entered=false,launched=false,loading=false,loaded=false;
  const poll=setInterval(async ()=>{
    if(loading||loaded)return;
    try {
      if(++attempts>160)throw Error("Actual game scene did not become ready");
      const win=frame.contentWindow,doc=frame.contentDocument;
      if(!doc||doc.readyState!=="complete")return;
      if(doc.querySelector("#loginCalendar.active")){
        doc.querySelector('#loginCalendar [data-screen="home"]')?.click();
        entered=false;launched=false;return;
      }
      if(doc.querySelector("#home.active")&&!entered){
        entered=true;doc.querySelector("#startBattle")?.click();return;
      }
      if(doc.querySelector("#squad.active")&&!launched){
        launched=true;doc.querySelector("#squadStart")?.click();return;
      }
      const canvas=doc.querySelector("#renderCanvas");
      if(!doc.querySelector("#battle.active")||!canvas?.width||!canvas?.height)return;
      const B=win.BABYLON,scene=win.eval("scene"),camera=win.eval("arenaCamera"),engine=win.eval("engine");
      if(!B||!scene||!camera||!engine)throw Error("Babylon engine not initialized");
      loading=true;
      const response=await fetch("../../build/env021/scene.glb",{cache:"no-store"});
      if(!response.ok)throw Error("Pass005 GLB unavailable, HTTP "+response.status);
      const raw=await response.arrayBuffer(),header=new DataView(raw);
      if(raw.byteLength<20||header.getUint32(0,true)!==0x46546c67||
         header.getUint32(4,true)!==2||header.getUint32(8,true)!==raw.byteLength)
        throw Error("Malformed GLB v2");
      let hidden=0;
      for(const obj of scene.meshes){
        if(/^(env017_|env010_|env009_|cv007_)/.test(obj.name)&&
           !/cv007_hit_/.test(obj.name)){
          obj.setEnabled(false);hidden++;
        }
      }
      scene.clearColor=new B.Color4(.56,.61,.64,1);
      if(!B.SceneLoader.IsPluginForExtensionAvailable?.(".glb")){
        await new Promise((resolve,reject)=>{
          const script=doc.createElement("script");
          script.src="https://cdn.babylonjs.com/v9.33.2/loaders/babylonjs.loaders.min.js";
          script.onload=resolve;
          script.onerror=()=>reject(Error("Pinned Babylon GLB loader unavailable"));
          doc.head.appendChild(script);
        });
      }
      const result=await B.SceneLoader.ImportMeshAsync(null,"/build/env021/","scene.glb",scene);
      const candidates=result.meshes.filter(m=>m.getTotalVertices?.()>0);
      if(candidates.length!==2)throw Error("Expected two drawable GLB meshes; got "+candidates.length);
      const artReview=new URLSearchParams(location.search).get("review")==="1";
      let verts=0,tris=0;
      for(let i=0;i<candidates.length;i++){
        const mesh=candidates[i];
        mesh.name="env021_candidate_"+i+"_"+mesh.name;
        const mat=new B.StandardMaterial("env021_preview_clay_"+i,scene);
        mat.diffuseColor=artReview?(i?new B.Color3(.40,.43,.45):new B.Color3(.54,.50,.46)):(i?new B.Color3(.1,.85,.9):new B.Color3(.92,.16,.2));
        mat.emissiveColor=artReview?new B.Color3(.03,.03,.03):(i?new B.Color3(.1,.85,.9):new B.Color3(.92,.16,.2));
        mat.specularColor=new B.Color3(.025,.025,.025);
        mat.disableLighting=!artReview;mat.fogEnabled=false;mat.backFaceCulling=false;
        mesh.material=mat;
        mesh.isPickable=false;mesh.checkCollisions=false;
        mesh.alwaysSelectAsActiveMesh=true;
        verts+=mesh.getTotalVertices();tris+=mesh.getTotalIndices()/3;
      }
      if(verts<1000||tris<1000)throw Error("Too few imported vertices or triangles");
      camera.radius=far?19:12;
      scene.render();
      await new Promise(resolve=>setTimeout(resolve,250));
      scene.render();
      const active=scene.getActiveMeshes().data.filter(m=>m&&m.name.startsWith("env021_candidate_"));
      d.activeMeshes=String(active.length);
      if(active.length!==2)throw Error("Both GLB meshes must be active");
      const fighters=win.eval("Object.values(meshes).filter(x=>x.body.isEnabled()).length");
      if(fighters<2)throw Error("Actual battle fighters missing");
      // Capture identical gameplay state with/without ONLY imported scenery.
      const withTerrain=await engine.readPixels(0,0,engine.getRenderWidth(),engine.getRenderHeight());
      for(const mesh of candidates)mesh.setEnabled(false);
      scene.render();
      const withoutTerrain=await engine.readPixels(0,0,engine.getRenderWidth(),engine.getRenderHeight());
      for(const mesh of candidates)mesh.setEnabled(true);
      scene.render();
      if(withTerrain.length!==withoutTerrain.length)throw Error("Inconsistent WebGL frame sizes");
      let changed=0,red=0,cyan=0;
      for(let i=0;i<withTerrain.length;i+=4){
        const r=withTerrain[i],g=withTerrain[i+1],b=withTerrain[i+2];
        const or=withoutTerrain[i],og=withoutTerrain[i+1],ob=withoutTerrain[i+2];
        if(Math.abs(r-or)+Math.abs(g-og)+Math.abs(b-ob)>20)changed++;
        if(r>165&&g<105&&b<125&&!(or>165&&og<105&&ob<125))red++;
        if(r<110&&g>145&&b>155&&!(or<110&&og>145&&ob>155))cyan++;
      }
      d.candidateDifferencePixels=String(changed);
      d.candidateOnlyRedPixels=String(red);
      d.candidateOnlyCyanPixels=String(cyan);
      if((!artReview&&(red<120||cyan<120))||changed<300)
        throw Error("Pass005 terrain is not visibly rasterized: changed="+changed+" red="+red+" cyan="+cyan);
      const requestedPass=new URLSearchParams(location.search).get("pass");
      const pass=["005","006","007","008","009","010","011","012","013"].includes(requestedPass)?requestedPass:"005";
      d.art="ENV021_PASS"+pass+"_GLB_NOT_APPROVED";
      d.verts=String(verts);d.tris=String(tris);d.hiddenScenery=String(hidden);
      d.fighters=String(fighters);d.camera=String(camera.radius);
      d.loader="BABYLON_9_33_2_NATIVE_GLTF";d.webgl="true";
      d.artReview=artReview?"neutral_lit":"diagnostic_emissive";
      loaded=true;clearInterval(poll);
      const stamp=document.createElement("div");
      stamp.textContent="ENV021 PASS "+pass+" RASTERIZED — ART UNAPPROVED";
      stamp.style.cssText="position:absolute;top:0;left:34%;z-index:1000;background:#a20b8d;color:white;padding:2px 7px;font:11px monospace;pointer-events:none";
      document.body.appendChild(stamp);
      setTimeout(()=>d.visualStatus="ready",1200);
    } catch(error){
      clearInterval(poll);
      d.visualStatus="error";d.error=String(error?.message||error);
      console.error(error);
    }
  },125);
})();
</script></body></html>
