<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HQ UI Chromium smoke</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;border:0;width:100vw;height:100dvh}</style></head>
<body data-hq-status="loading"><iframe id="game" src="../../index.html" title="Штаб"></iframe>
<script>
const frame=document.getElementById("game");
function error(message){document.body.dataset.hqStatus="error";document.body.dataset.hqError=String(message).slice(0,200)}
frame.addEventListener("load",async()=>{
 try {
  const doc=frame.contentDocument,win=frame.contentWindow,pan=doc.getElementById("hqPan"),home=doc.getElementById("home");
  if(!pan||!home||typeof win.showScreen!=="function")throw Error("Main game not initialized");
  // A first-day login calendar may open automatically: the fixture only changes the visible section.
  doc.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s===home));
  const stations=[...home.querySelectorAll(".hq-station")];
  if(stations.length!==4||pan.scrollWidth<=pan.clientWidth+250)throw Error("Not a four-station panorama");
  // HQ-UI-003 uses a proportional painting instead of an oversized decorative SVG.
  // Every station must remain within the pan area, reachable by horizontal swipe.
  const end=stations[3].getBoundingClientRect().right-pan.getBoundingClientRect().left;
  if(end>pan.scrollWidth+2)throw Error("Last station beyond panorama");
  const vr=pan.getBoundingClientRect();
  const visible=stations.filter(s=>{const r=s.getBoundingClientRect();return Math.min(r.right,vr.right)-Math.max(r.left,vr.left)>60});
  if(visible.length<2)throw Error("Fewer than two visible stations");
  const more=doc.getElementById("hqMoreToggle"),menu=doc.getElementById("hqMoreMenu");
  if(!more||!menu||!menu.hidden)throw Error("More menu starts open");
  more.click();if(menu.hidden)throw Error("More menu cannot open");
  more.click();if(!menu.hidden)throw Error("More menu cannot close");
  // HQ-UI-004: the illustrated landmarks are the buttons, with no nested cards.
  for(const [zone,target] of [["heroes","collection"],["campaign","campaign"],["operations","operations"],["challenges","challenges"]]){
   const hotspot=home.querySelector(".hq-station-"+zone);
   if(!hotspot||hotspot.tagName!=="BUTTON"||hotspot.dataset.screen!==target)throw Error("Non-interactive landmark: "+zone);
   const box=hotspot.getBoundingClientRect();
   if(box.width<90||box.height<90)throw Error("Landmark too small: "+zone);
   pan.scrollLeft=Math.max(0,hotspot.offsetLeft-60);
   hotspot.click();
   if(!home.classList.contains("active"))throw Error("Landmark navigated before illumination: "+zone);
   if(home.querySelector(".hq-scene").dataset.hqIlluminated!==zone)throw Error("Wrong object illuminated: "+zone);
   const scene=home.querySelector(".hq-scene");
   const fx=scene.querySelector("svg.hq-selection-fx");
   const group=fx?.querySelector(".hq-fx-"+zone);
   if(!fx||!group)throw Error("Missing object-specific light geometry: "+zone);
   if(fx.getAttribute("viewBox")!=="0 0 2048 688"||fx.getAttribute("preserveAspectRatio")!=="xMidYMid slice")
    throw Error("Light geometry is not image-aligned");
   const sceneStyle=win.getComputedStyle(scene);
   if(!sceneStyle.backgroundPosition.split(",").every(v=>v.trim()==="50% 50%"))
    throw Error("Artwork background is not aligned with SVG crop");
   if(win.getComputedStyle(group).animationName!=="hq-material-light")
    throw Error("Object-specific lighting animation is missing: "+zone);
   if(win.getComputedStyle(fx).pointerEvents!=="none")
    throw Error("Light blocks touch and swipe");
   await new Promise(resolve=>setTimeout(resolve,600));
   if(!doc.getElementById(target).classList.contains("active"))throw Error("Landmark navigation after glow broken: "+zone);
   if(home.querySelector(".hq-scene").dataset.hqIlluminated)throw Error("Light state not reset: "+zone);
   doc.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s===home));
  }
  doc.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s===home));
  pan.style.scrollBehavior="auto";pan.scrollLeft=400;
  if(pan.scrollLeft<100)throw Error("Panorama did not scroll");
  pan.scrollLeft=0;
  if(doc.documentElement.scrollWidth>doc.documentElement.clientWidth+2)throw Error("Page has horizontal overflow");
  const bar=home.querySelector(".hq-bottom").getBoundingClientRect();
  if(bar.bottom>doc.documentElement.clientHeight+3)throw Error("Bottom navigation clipped");
  document.body.dataset.hqVisibleStations=String(visible.length);
  // Screenshot-only art review mode. Not part of the functional assertion.
  // Freeze the peak of the actual CSS effect so screenshots can be compared
  // with a clean view, without relying on a frame-timing lottery.
  if(new URLSearchParams(location.search).get("fx-preview")==="campaign"){
   const scene=home.querySelector(".hq-scene");
   const group=scene.querySelector(".hq-fx-campaign");
   scene.dataset.hqIlluminated="campaign";
   group.style.animation="none";group.style.opacity=".94";
   group.querySelectorAll(".hq-fx-sheen,.hq-fx-specular,.hq-fx-glint,.hq-fx-engraving").forEach(el=>{
    el.style.animation="none";
    el.style.opacity=el.classList.contains("hq-fx-glint")?".94":".8";
    if(el.classList.contains("hq-fx-glint")){el.style.strokeDasharray="none";el.style.strokeDashoffset="0";}
   });
   const hotspot=home.querySelector(".hq-station-campaign");
   hotspot.classList.add("is-activating");
   pan.style.scrollSnapType="none";
   pan.scrollLeft=0; // compare exactly the same crop in plain and FX screenshots
  }
  document.body.dataset.hqStatus="pass";
 }catch(e){error(e&&e.message||e)}
});
setTimeout(()=>{if(document.body.dataset.hqStatus==="loading")error("Game load timed out")},18000);
</script></body></html>
